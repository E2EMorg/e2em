name: Release runtime and SDKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (must match the source version)'
        required: true
        type: string
      replace_existing:
        description: 'Replace the existing release assets and move its tag to this source commit'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  native:
    needs: version
    uses: ./.github/workflows/runtime-native.yml

  packages:
    needs: version
    uses: ./.github/workflows/runtime-packages.yml
    secrets: inherit

  sdks:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.1'
      - run: python3 -m pip install build
      - run: python3 scripts/package_sdks.py --output dist/sdk
      - name: Verify packaged Python SDK
        run: |
          python3 -m venv /tmp/e2em-sdk-check
          /tmp/e2em-sdk-check/bin/pip install --no-deps dist/sdk/*.whl
          cd /tmp
          /tmp/e2em-sdk-check/bin/python -c 'from e2em import Client, BlockingClient; from e2em.schema import SCHEMA; assert SCHEMA["$defs"]["Assessment"]'
      - name: Verify packaged Node SDK and types
        run: |
          PACKAGE=$(realpath dist/sdk/*.tgz)
          CHECK_DIR=$(mktemp -d)
          cd "$CHECK_DIR"
          npm init -y
          npm install "$PACKAGE"
          node --input-type=module -e "import {Client} from '@e2em/local'; if (typeof Client.open !== 'function') process.exit(1)"
      - name: Verify packaged Dart SDK
        run: |
          CHECK_DIR=$(mktemp -d)
          tar -xzf dist/sdk/e2em-dart-sdk-*.tar.gz -C "$CHECK_DIR"
          cd "$CHECK_DIR"/e2em-dart-sdk-*
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos
          dart test
      - uses: actions/upload-artifact@v4
        with:
          name: e2em-sdk-packages
          path: dist/sdk/*
          if-no-files-found: error

  publish:
    needs: [version, checks, native, packages, sdks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/downloads
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install cryptography
      - name: Verify installer metadata and write checksums
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 scripts/check_release.py --tag "$RELEASE_TAG" --downloads dist/downloads --assets dist/release
      - name: Record the source and qualification run
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --assets dist/release --provenance-only
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: dist/release/*
          if-no-files-found: error
      - name: Preserve the existing release before replacement
        if: inputs.replace_existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --backup dist/release-backup --backup-only
      - uses: actions/upload-artifact@v4
        if: inputs.replace_existing
        with:
          name: previous-release-backup
          path: dist/release-backup/
          if-no-files-found: error
      - name: Publish stable runtime and SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          if [ "$REPLACE_EXISTING" = true ]; then
            python3 scripts/publish_release.py --tag "$RELEASE_TAG" --assets dist/release --backup dist/release-backup --replace-existing
          else
            gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "E2EM ${RELEASE_TAG#v}" --notes-file .github/RELEASE_NOTES.md
          fi
