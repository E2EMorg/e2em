[package]
name = "e2em-platform"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/E2EMorg/e2em"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }
